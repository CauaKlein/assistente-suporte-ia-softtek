<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login e Registro</title>
    <link rel="stylesheet" href="./styles/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="login-register-container">
      <div class="login-register-form-box">
        <div class="login-register-button-box">
          <div id="login-register-btn"></div>
          <button
            type="button"
            class="login-register-toggle-btn"
            onclick="showLogin()"
          >
            Entrar
          </button>
          <button
            type="button"
            class="login-register-toggle-btn"
            onclick="showRegister()"
          >
            Registrar
          </button>
        </div>
        <div class="login-register-social-icons">
          <a href="#"><i class="fa-brands fa-google"></i></a>
          <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
          <a href="#"><i class="fa-brands fa-github"></i></a>
        </div>
        <form
          id="login-form"
          class="input-group login-register-input-group"
          action="./pages/home.html"
          method="post"
        >
          <input
            type="text"
            class="login-register-input-field"
            placeholder="Email"
            required
          />
          <input
            type="password"
            class="login-register-input-field"
            placeholder="Senha"
            required
          />
          <button type="submit" class="login-register-submit-btn">
            Entrar
          </button>
        </form>
        <form
          id="register-form"
          class="input-group login-register-input-group"
          action="./pages/home.html"
          method="post"
        >
          <input
            type="text"
            class="login-register-input-field"
            placeholder="Nome"
            required
          />
          <input
            type="text"
            class="login-register-input-field"
            placeholder="Email"
            required
          />
          <input
            type="password"
            class="login-register-input-field"
            placeholder="Senha"
            required
          />
          <button type="submit" class="login-register-submit-btn">
            Registrar
          </button>
        </form>
      </div>
    </div>
    <script src="./scripts/script.js"></script>
  </body>
</html>
