<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Softtek - Perfil</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container-fluid">
        <a class="navbar-brand" href="chatbot.html">BEL</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="../pages/home.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="../pages/perfil.html">Perfil</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="../pages/chamados.html">Chamados</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="../pages/sobre.html">Sobre o Projeto</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <section class="hero hero-perfil">
      <div class="hero-content">
        <h1>Personalize o seu Perfil!</h1>
        <p>
          Adapte seu perfil às suas preferências e mostre sua identidade.
          Personalize detalhes para uma experiência única e autêntica.
        </p>
      </div>
    </section>

    <div class="container mt-5">
      <div class="card p-4">
        <h2>Perfil do Usuário</h2>
        <div class="text-center mb-4">
          <img
            src="../images/266033.png"
            alt="Foto de Perfil"
            class="rounded-circle"
            width="150"
          />
          <div class="mt-2">
            <input type="file" id="upload-photo" class="form-control-file" />
          </div>
        </div>
        <div class="mb-3">
          <label for="profile-name" class="form-label">Nome</label>
          <input
            type="text"
            class="form-control"
            id="profile-name"
            value="Nome do Usuário"
            disabled
          />
        </div>
        <div class="mb-3">
          <label for="profile-email" class="form-label">Email</label>
          <input
            type="email"
            class="form-control"
            id="profile-email"
            value="usuario@exemplo.com"
            disabled
          />
        </div>
        <div class="mb-3">
          <label for="profile-password" class="form-label">Senha</label>
          <input
            type="password"
            class="form-control"
            id="profile-password"
            value="********"
            disabled
          />
        </div>
        <div class="mb-3">
          <label for="profile-description" class="form-label"
            >Descrição de Tarefas</label
          >
          <textarea
            class="form-control"
            id="profile-description"
            rows="3"
            placeholder="Comente sobre suas funções..."
          ></textarea>
        </div>
        <button class="btn btn-primary" id="edit-profile">
          Salvar Alterações
        </button>
      </div>
    </div>

    <footer class="footer sobre-footer">
      <p>&copy; 2024 AssistAI. Todos os direitos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../scripts/script.js"></script>
  </body>
</html>
